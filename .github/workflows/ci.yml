name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    # gift-authority-tick-fanout 10: the reserved-debit ledger suite
    # (tests/integration/gift/ledger.redis.test.ts) proves money invariants
    # against a REAL Redis and skips loudly without one — CI must provide it.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Guard against tracked Terraform plan/state artifacts
      run: |
        matches=$(git ls-files | grep -Ei '(^|/)tfplan|\.tfstate' || true)
        if [ -n "$matches" ]; then
          echo "$matches"
          echo "::error::Terraform plan/state artifacts are tracked in git. See docs/issues/secrets-repo-cleanup/05-untrack-tfplan-and-add-commit-guard.md"
          exit 1
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npm run typecheck
      
    - name: Build
      run: npm run build
      
    - name: Lint
      run: npm run lint --if-present

    - name: Architecture Guardrails
      run: npm run architecture:check
      
    - name: Test
      run: npm test
      env:
        MSAB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
