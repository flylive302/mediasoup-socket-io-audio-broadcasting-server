name: Deploy via ECR + ASG Instance Refresh

# AWS account is suspended (see docs/prd-msab-vultr-migration.md) — kept as a
# dormant, manually-redeployable backup. No longer runs on push; ghcr-publish.yml
# is the live image pipeline.
on:
  workflow_dispatch: # Manual trigger from GitHub UI

# Only one deploy workflow at a time (queues, doesn't cancel)
concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    environment: aws-production
    # Ticket 12: OIDC federation — the job requests a short-lived identity
    # token and assumes the deploy role; no static AWS keys exist anywhere.
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          ECR_REPO="flylive-audio/msab"
          SHA_TAG="sha-${GITHUB_SHA::8}"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPO}"

          echo "registry=${ECR_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "repository=${ECR_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "📦 Image: ${FULL_IMAGE}:${SHA_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Ticket 14: sha tag ONLY — the ECR repo is IMMUTABLE, so re-pushing a
          # ":latest" tag would fail every run after the first with
          # ImageTagAlreadyExistsException. Deploys pin the sha tag; nothing may
          # reference ":latest".
          tags: |
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-arch: amd64 (c7i, current prod) + arm64 (c8g/Graviton, realtime-06).
          # Pushes a manifest list so either instance arch pulls its native image.
          # NOTE: the arm64 leg compiles the mediasoup C++ worker under QEMU on the
          # amd64 runner — slow. If build time approaches the job limit, move the
          # arm64 build to a native arm runner + `docker manifest` merge.
          platforms: linux/amd64,linux/arm64

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${{ steps.meta.outputs.repository }}" \
            --image-ids imageTag="${{ steps.meta.outputs.image_tag }}" \
            --query 'imageDetails[0].{Size: imageSizeInBytes, Pushed: imagePushedAt, Tags: imageTags}' \
            --output table
          echo "✅ Image pushed and verified"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: aws-production
    # Ticket 12: OIDC federation — see build-and-push.
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false # Don't cancel other regions if one fails
      # AUDIT-005 FIX: Deploy sequentially — if Mumbai breaks, Frankfurt stays healthy
      max-parallel: 1
      matrix:
        region:
          - name: mumbai
            aws_region: ap-south-1
          - name: frankfurt
            aws_region: eu-central-1
          - name: singapore
            aws_region: ap-southeast-1

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ matrix.region.aws_region }}

      - name: Discover ASG name (${{ matrix.region.name }})
        id: asg
        run: |
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?contains(Tags[?Key=='Project'].Value, 'flylive-audio')].AutoScalingGroupName | [0]" \
            --output text)

          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" = "None" ]; then
            echo "❌ No ASG found with Project=flylive-audio tag in ${{ matrix.region.aws_region }}"
            exit 1
          fi

          echo "✅ Found ASG: $ASG_NAME"
          echo "asg_name=$ASG_NAME" >> "$GITHUB_OUTPUT"

      - name: Cancel existing Instance Refresh (${{ matrix.region.name }})
        run: |
          ASG_NAME="${{ steps.asg.outputs.asg_name }}"

          # Check if there's an active refresh
          ACTIVE_STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --max-records 1 \
            --query 'InstanceRefreshes[0].Status' \
            --output text 2>/dev/null || echo "None")

          if [ "$ACTIVE_STATUS" = "InProgress" ] || [ "$ACTIVE_STATUS" = "Pending" ]; then
            echo "⚠️  Active refresh found (status: $ACTIVE_STATUS). Cancelling..."
            aws autoscaling cancel-instance-refresh \
              --auto-scaling-group-name "$ASG_NAME" || true

            # Wait for cancellation to complete
            for i in $(seq 1 20); do
              sleep 15
              STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$ASG_NAME" \
                --max-records 1 \
                --query 'InstanceRefreshes[0].Status' \
                --output text 2>/dev/null || echo "None")

              echo "  ⏳ Cancellation status: $STATUS (${i}/20)"

              if [ "$STATUS" != "Cancelling" ] && [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then
                echo "✅ Previous refresh resolved (status: $STATUS)"
                break
              fi
            done
          else
            echo "✅ No active refresh to cancel (status: $ACTIVE_STATUS)"
          fi

          # Also complete any stuck lifecycle hooks
          PENDING_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='Pending:Wait'].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -n "$PENDING_INSTANCES" ] && [ "$PENDING_INSTANCES" != "None" ]; then
            LAUNCH_HOOK=$(aws autoscaling describe-lifecycle-hooks \
              --auto-scaling-group-name "$ASG_NAME" \
              --query "LifecycleHooks[?LifecycleTransition=='autoscaling:EC2_INSTANCE_LAUNCHING'].LifecycleHookName | [0]" \
              --output text 2>/dev/null || echo "")

            if [ -n "$LAUNCH_HOOK" ] && [ "$LAUNCH_HOOK" != "None" ]; then
              for INSTANCE_ID in $PENDING_INSTANCES; do
                echo "  🔧 Completing launch lifecycle hook for $INSTANCE_ID"
                aws autoscaling complete-lifecycle-action \
                  --lifecycle-action-result CONTINUE \
                  --instance-id "$INSTANCE_ID" \
                  --auto-scaling-group-name "$ASG_NAME" \
                  --lifecycle-hook-name "$LAUNCH_HOOK" || true
              done
            fi
          fi

      - name: Start Instance Refresh (${{ matrix.region.name }})
        id: refresh
        run: |
          ASG_NAME="${{ steps.asg.outputs.asg_name }}"
          echo "🚀 Starting instance refresh for $ASG_NAME in ${{ matrix.region.aws_region }}..."

          # ⚠️ Ticket 29: this CLI-triggered refresh CANNOT ship a new image. The image tag
          # is baked into user-data by terraform (modules/autoscaling/user-data.sh pulls
          # $ECR_REPO_URL:${image_tag}) — a bare refresh relaunches the SAME pinned tag.
          # A real deploy = bump var.image_tag → terraform apply → new launch-template
          # version → the ASG's own terraform-configured instance_refresh (which carries
          # AutoRollback and is the canonical canary path). This workflow remains useful
          # as a same-image re-roll (e.g. host rot, config re-read) only.
          #
          # Preferences MIRROR modules/autoscaling/main.tf `instance_refresh` — if you
          # change one, change both (tests/rollout.tftest.hcl pins the terraform side):
          #   InstanceWarmup 350 = container_warmup(90) + bootstrap_overhead(260)
          #   Checkpoint 25% ≈ one canary instance at fleet_size 4 (ceil(100/N))
          #   CheckpointDelay 300 = canary_soak_seconds (≥ 270s abort-detection window)
          #   Alarms = the automated continue-or-abort signals
          # AutoRollback is terraform-path only: a same-image CLI refresh has no previous
          # launch-template version to roll back to.
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 350,
              "CheckpointPercentages": [25, 100],
              "CheckpointDelay": 300,
              "AlarmSpecification": {"Alarms": ["flylive-audio-zero-healthy-hosts", "flylive-audio-refresh-unhealthy-sustained"]}
            }' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "🔄 Instance refresh started: $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Instance Refresh (${{ matrix.region.name }})
        run: |
          ASG_NAME="${{ steps.asg.outputs.asg_name }}"
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          MAX_WAIT=2400  # 40 minutes (increased from 30 for cross-region ECR pulls)
          ELAPSED=0
          INTERVAL=30
          LAST_PROGRESS=""
          STALL_COUNT=0
          STALL_THRESHOLD=6  # 6 polls × 30s = 3 minutes of no progress change

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            PROGRESS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].PercentageComplete' \
              --output text 2>/dev/null || echo "0")

            echo "  ⏳ Status: $STATUS | Progress: ${PROGRESS}% (${ELAPSED}s elapsed)"

            case "$STATUS" in
              Successful)
                echo "✅ Instance refresh completed successfully!"
                exit 0
                ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed)
                echo "❌ Instance refresh $STATUS"
                aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name "$ASG_NAME" \
                  --instance-refresh-ids "$REFRESH_ID" \
                  --query 'InstanceRefreshes[0].StatusReason' \
                  --output text
                exit 1
                ;;
              *)
                # Track progress stalls at ANY percentage (not just 0%)
                if [ "$PROGRESS" = "$LAST_PROGRESS" ]; then
                  STALL_COUNT=$((STALL_COUNT + 1))
                else
                  STALL_COUNT=0
                  LAST_PROGRESS="$PROGRESS"
                fi

                # If progress hasn't changed for STALL_THRESHOLD polls, investigate and rescue
                if [ $STALL_COUNT -ge $STALL_THRESHOLD ]; then
                  echo ""
                  echo "  ⚠️  Progress stuck at ${PROGRESS}% for $((STALL_COUNT * INTERVAL))s — running diagnostics..."

                  # Diagnostic: Show instance lifecycle states
                  echo "  📊 Instance states:"
                  aws autoscaling describe-auto-scaling-groups \
                    --auto-scaling-group-name "$ASG_NAME" \
                    --query "AutoScalingGroups[0].Instances[].{Id:InstanceId,State:LifecycleState,Health:HealthStatus}" \
                    --output table 2>/dev/null || true

                  # Diagnostic: Show recent scaling activities
                  echo "  📊 Recent scaling activities:"
                  aws autoscaling describe-scaling-activities \
                    --auto-scaling-group-name "$ASG_NAME" \
                    --max-items 3 \
                    --query "Activities[].{Status:StatusCode,Cause:Cause}" \
                    --output table 2>/dev/null || true

                  # Rescue: Complete any stuck launch lifecycle hooks
                  PENDING=$(aws autoscaling describe-auto-scaling-groups \
                    --auto-scaling-group-name "$ASG_NAME" \
                    --query "AutoScalingGroups[0].Instances[?LifecycleState=='Pending:Wait'].InstanceId" \
                    --output text 2>/dev/null || echo "")

                  if [ -n "$PENDING" ] && [ "$PENDING" != "None" ]; then
                    LAUNCH_HOOK=$(aws autoscaling describe-lifecycle-hooks \
                      --auto-scaling-group-name "$ASG_NAME" \
                      --query "LifecycleHooks[?LifecycleTransition=='autoscaling:EC2_INSTANCE_LAUNCHING'].LifecycleHookName | [0]" \
                      --output text 2>/dev/null || echo "")

                    if [ -n "$LAUNCH_HOOK" ] && [ "$LAUNCH_HOOK" != "None" ]; then
                      for IID in $PENDING; do
                        echo "  🔧 Auto-completing launch hook for $IID"
                        aws autoscaling complete-lifecycle-action \
                          --lifecycle-action-result CONTINUE \
                          --instance-id "$IID" \
                          --auto-scaling-group-name "$ASG_NAME" \
                          --lifecycle-hook-name "$LAUNCH_HOOK" || true
                      done
                    fi
                  else
                    echo "  ℹ️  No instances in Pending:Wait — stall likely caused by health check failures"
                  fi

                  # Reset stall counter so diagnostics don't spam every poll
                  STALL_COUNT=0
                  echo ""
                fi

                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
                ;;
            esac
          done

          echo "❌ Timed out after ${MAX_WAIT}s waiting for instance refresh"
          exit 1

      - name: Health Soak — Verify stability (${{ matrix.region.name }})
        # Ticket 29: this whole-region soak is now the SECONDARY gate. The primary
        # canary gate runs INSIDE the refresh above (CheckpointDelay + AlarmSpecification):
        # one instance soaks under real traffic and any abort alarm fails the refresh
        # automatically. This step remains as a final cross-region barrier before the
        # matrix moves on.
        run: |
          echo "🕐 Starting 3-minute health soak for ${{ matrix.region.name }}..."
          echo "   New instances must stay healthy for 180s before proceeding to next region."

          ASG_NAME="${{ steps.asg.outputs.asg_name }}"
          SOAK_DURATION=180
          INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $SOAK_DURATION ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            # Check healthy instance count
            HEALTHY=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-name "$ASG_NAME" \
              --query "AutoScalingGroups[0].Instances[?HealthStatus=='Healthy'] | length(@)" \
              --output text 2>/dev/null || echo "0")

            TOTAL=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-name "$ASG_NAME" \
              --query "AutoScalingGroups[0].Instances | length(@)" \
              --output text 2>/dev/null || echo "0")

            echo "  ⏳ Health soak: ${ELAPSED}s/${SOAK_DURATION}s — ${HEALTHY}/${TOTAL} instances healthy"

            if [ "$HEALTHY" -lt 1 ]; then
              echo "❌ SOAK FAILED: Zero healthy instances at ${ELAPSED}s — aborting deploy!"
              echo "   ⛔ Next region will NOT be deployed."
              exit 1
            fi
          done

          echo "✅ Health soak passed — all instances stable for ${SOAK_DURATION}s"

      - name: Post Configure AWS Credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ matrix.region.aws_region }}

      - name: Rescue — un-drain any stranded InService instance (${{ matrix.region.name }})
        # Ticket 29 AC: a halted rollout must un-drain, not strand. On AWS the drain
        # script only fires in Terminating:Wait (irreversible — that instance dies
        # regardless), so a drained-but-InService instance should be impossible; this
        # step is the belt-and-braces check that makes the property observable. It
        # cancels any still-running refresh on failure, then checks/undrains each
        # InService instance via SSM Run Command: the curl runs ON the instance
        # against localhost, reading X-Internal-Key from the instance's own
        # /opt/msab/.env.secrets — the credential never crosses the network and
        # this workflow never holds it (no plaintext-HTTP transport of the key).
        if: failure()
        run: |
          ASG_NAME="${{ steps.asg.outputs.asg_name }}"
          [ -n "$ASG_NAME" ] || { echo "No ASG discovered — nothing to rescue"; exit 0; }

          echo "🛟 Rollout failed — cancelling any in-flight refresh and checking for stranded drains..."
          aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" 2>/dev/null \
            && echo "  🚫 Cancelled in-flight instance refresh" \
            || echo "  (no refresh in flight)"

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          # Runs on the instance as root; secrets file is 600 root-owned.
          REMOTE_SCRIPT='set -a; . /opt/msab/.env.secrets; set +a;
            STATUS=$(curl -sf -m 10 -H "X-Internal-Key: $LARAVEL_INTERNAL_KEY" http://localhost:3030/admin/status);
            DRAINING=$(echo "$STATUS" | grep -o "\"draining\":[a-z]*" | cut -d: -f2);
            if [ "$DRAINING" = "true" ]; then
              curl -sf -m 10 -X POST -H "X-Internal-Key: $LARAVEL_INTERNAL_KEY" http://localhost:3030/admin/undrain && echo UNDRAINED;
            else
              echo "draining=$DRAINING";
            fi'

          # jq builds the parameter JSON so the script's own quotes survive intact.
          SSM_PARAMS=$(jq -n --arg c "$REMOTE_SCRIPT" '{commands: [$c]}')

          for ID in $INSTANCE_IDS; do
            echo "  🔍 $ID — checking drain state via SSM Run Command..."
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$ID" \
              --document-name "AWS-RunShellScript" \
              --comment "rollout rescue: un-drain if stranded (ticket 29)" \
              --parameters "$SSM_PARAMS" \
              --query 'Command.CommandId' --output text) || { echo "  ⚠️ send-command failed for $ID"; continue; }

            for _ in $(seq 1 10); do
              sleep 3
              STATE=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
                --query 'Status' --output text 2>/dev/null || echo "Pending")
              [ "$STATE" = "Success" ] || [ "$STATE" = "Failed" ] && break
            done
            OUTPUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query 'StandardOutputContent' --output text 2>/dev/null || echo "?")
            echo "  📋 $ID: status=$STATE output: $OUTPUT"
          done

      - name: Complete job
        if: always()
        run: echo "Deploy job for ${{ matrix.region.name }} finished with status ${{ job.status }}"
