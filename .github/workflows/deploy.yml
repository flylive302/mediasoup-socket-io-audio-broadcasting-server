name: App Release — ECR build + scoped Terraform apply + ASG refresh

# Ticket 30 — the APPLICATION pipeline, one of exactly two release paths:
#
#   deploy.yml               → application releases (image_tag changes ONLY)
#   terraform-aws-infra.yml  → infrastructure changes (everything EXCEPT image_tag)
#
# How an app release actually ships (ticket 29): the image tag is baked into
# launch-template user-data by terraform, so a release is `terraform apply` with
# a new image_tag → new launch-template version → the ASG's own
# terraform-configured instance_refresh (canary checkpoint + soak + abort alarms
# + auto_rollback). This workflow drives that apply — but through a SCOPE GUARD:
# the plan may only touch launch templates and autoscaling groups. Anything else
# in the plan (drift, or an infra edit riding along) fails the run and points at
# the infra pipeline. That closes the ticket's core gap: the untargeted
# fleet-wide apply is no longer reachable from an application release.
#
# Separation rules (ticket 30 ACs):
#   - Manual dispatch only — merging to master never deploys by itself
#     (ghcr-publish.yml builds an image on push; publishing is not releasing).
#   - The aws-production GitHub environment's required-reviewer setting is the
#     explicit human approval, for forward deploys AND rollbacks alike.
#   - Rollback = dispatch with the `image_tag` input pinned to a previous
#     sha-<commit8> tag (ticket 14's mechanism) — same pipeline, same guard,
#     same approval. No second mechanism.
#   - No workflow_call / workflow_run wiring in either direction between the
#     two pipelines.
#
# AWS account status: fresh account, fleet not yet applied (see epic
# aws-platform-build) — runnable end-to-end only once the environment holds the
# reissued credentials + TF_BACKEND_PROD / TF_VARS_PROD.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ECR tag (sha-<commit8>) to deploy — the ROLLBACK / redeploy path. Leave empty to build and release the current commit."
        required: false
        type: string
        default: ""

# Only one release at a time (queues, doesn't cancel)
concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  ci:
    # Skipped when redeploying an already-built tag: that image's commit passed
    # CI when it was built, and a rollback must not be blocked by HEAD's state.
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test

  build-and-push:
    if: ${{ inputs.image_tag == '' }}
    needs: ci
    runs-on: ubuntu-latest
    environment: aws-production
    # Ticket 12: OIDC federation — the job requests a short-lived identity
    # token and assumes the deploy role; no static AWS keys exist anywhere.
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          ECR_REPO="flylive-audio/msab"
          SHA_TAG="sha-${GITHUB_SHA::8}"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPO}"

          echo "registry=${ECR_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "repository=${ECR_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "📦 Image: ${FULL_IMAGE}:${SHA_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Ticket 14: sha tag ONLY — the ECR repo is IMMUTABLE, so re-pushing a
          # ":latest" tag would fail every run after the first with
          # ImageTagAlreadyExistsException. Deploys pin the sha tag; nothing may
          # reference ":latest".
          tags: |
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-arch: amd64 (c7i, current prod) + arm64 (c8g/Graviton, realtime-06).
          # Pushes a manifest list so either instance arch pulls its native image.
          # NOTE: the arm64 leg compiles the mediasoup C++ worker under QEMU on the
          # amd64 runner — slow. If build time approaches the job limit, move the
          # arm64 build to a native arm runner + `docker manifest` merge.
          platforms: linux/amd64,linux/arm64

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${{ steps.meta.outputs.repository }}" \
            --image-ids imageTag="${{ steps.meta.outputs.image_tag }}" \
            --query 'imageDetails[0].{Size: imageSizeInBytes, Pushed: imagePushedAt, Tags: imageTags}' \
            --output table
          echo "✅ Image pushed and verified"

  release:
    # Runs for BOTH paths: after a fresh build, or directly when the image_tag
    # input pins an existing tag (rollback / redeploy). `!cancelled()` +
    # explicit result checks let the skipped-build path through while a FAILED
    # build still blocks the release.
    if: >-
      ${{ !cancelled() && (
        needs.build-and-push.result == 'success' ||
        (needs.build-and-push.result == 'skipped' && inputs.image_tag != '')
      ) }}
    needs: build-and-push
    runs-on: ubuntu-latest
    # Required-reviewer gate (ticket 30 AC: explicit approval before production,
    # rollback included — no fast path around it).
    environment: aws-production
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      applied: ${{ steps.scope.outputs.applied }}
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          TAG="${INPUT_TAG:-$BUILT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No image tag — neither built nor supplied as input."
            exit 1
          fi
          case "$TAG" in
            sha-????????) ;;
            *)
              echo "::error::image_tag must be sha-<commit8> (ticket 14 pinned-tag rule), got: $TAG"
              exit 1
              ;;
          esac
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "🏷  Releasing $TAG"

      - name: Verify tag exists in ECR (rollback path)
        # The build path already verified its own push; the pinned-tag path must
        # prove the artifact exists before terraform bakes it into user-data.
        if: ${{ inputs.image_tag != '' }}
        env:
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          aws ecr describe-images \
            --repository-name "flylive-audio/msab" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].{Pushed: imagePushedAt, Tags: imageTags}' \
            --output table
          echo "✅ $TAG exists in ECR"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Materialize gitignored backend + tfvars from secrets
        env:
          TF_BACKEND_PROD: ${{ secrets.TF_BACKEND_PROD }}
          TF_VARS_PROD: ${{ secrets.TF_VARS_PROD }}
        run: |
          printf '%s' "$TF_BACKEND_PROD" > backend-ci.hcl
          printf '%s' "$TF_VARS_PROD" > ci.tfvars
          test -s backend-ci.hcl && test -s ci.tfvars

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend-ci.hcl

      - name: Terraform plan (image_tag only)
        env:
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: terraform plan -input=false -var-file=ci.tfvars -var "image_tag=$TAG" -out=tfplan

      - name: Scope guard — an app release may only roll the fleet (ticket 30)
        id: scope
        # The core of the ticket: this pipeline is FORBIDDEN from making
        # infrastructure changes. The plan may touch launch templates (the new
        # user-data with the new tag) and autoscaling groups (the refresh
        # trigger) — nothing else. Any other resource in the plan means drift or
        # an infra edit riding along with an app release; either way the release
        # stops and the change goes through terraform-aws-infra.yml, where the
        # full plan is reviewed and approved as an infra change.
        run: |
          terraform show -json tfplan > plan.json
          DISALLOWED=$(jq -r '
            [.resource_changes[]?
              | select((.change.actions | join(",")) as $a
                       | $a != "no-op" and $a != "read")
              | select(.type != "aws_launch_template"
                       and .type != "aws_autoscaling_group")
              | "\(.address) [\(.change.actions | join(","))]"
            ] | .[]' plan.json)
          if [ -n "$DISALLOWED" ]; then
            echo "::error::Plan contains changes outside the app-release scope — use terraform-aws-infra.yml for these:"
            echo "$DISALLOWED"
            exit 1
          fi

          CHANGES=$(jq -r '
            [.resource_changes[]?
              | select((.change.actions | join(",")) as $a
                       | $a != "no-op" and $a != "read")
              | .address
            ] | length' plan.json)
          if [ "$CHANGES" -eq 0 ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Plan is a no-op — this tag is already live. Nothing to apply."
          else
            echo "applied=true" >> "$GITHUB_OUTPUT"
            echo "✅ Scope OK: $CHANGES change(s), all launch-template/ASG."
          fi

      - name: Terraform apply (starts the canary refresh in every region)
        if: ${{ steps.scope.outputs.applied == 'true' }}
        run: terraform apply -input=false tfplan

  monitor:
    # The apply above bumped each region's launch template, which starts that
    # region's ASG instance refresh (ticket 29: canary checkpoint + soak +
    # abort alarms + auto_rollback). This job only OBSERVES — the refresh
    # succeeds or auto-rolls-back on its own; failing here still triggers the
    # un-drain rescue step and marks the run red for humans.
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.applied == 'true' }}
    runs-on: ubuntu-latest
    environment: aws-production
    # Ticket 12: OIDC federation — see build-and-push.
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false # Don't stop watching other regions if one fails
      max-parallel: 3 # Observation only — the refreshes run concurrently regardless
      matrix:
        region:
          - name: mumbai
            aws_region: ap-south-1
          - name: frankfurt
            aws_region: eu-central-1
          - name: singapore
            aws_region: ap-southeast-1

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ matrix.region.aws_region }}

      - name: Discover ASG name (${{ matrix.region.name }})
        id: asg
        run: |
          # Ticket 31 / decision D3: the Project tag is the BARE project name in
          # every environment, so it no longer identifies one fleet by itself —
          # staging and production now coexist in the same AWS account
          # (ADR 0028). Filtering on Project alone would match both ASGs and
          # `| [0]` would silently pick an arbitrary one, which is how a staging
          # deploy reaches the production fleet. Environment is the discriminator
          # (modules/autoscaling/main.tf declares it as an ASG tag). This job runs
          # under the `aws-production` GitHub environment, so it targets production.
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?contains(Tags[?Key=='Project'].Value, 'flylive-audio') && contains(Tags[?Key=='Environment'].Value, 'production')].AutoScalingGroupName | [0]" \
            --output text)

          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" = "None" ]; then
            echo "❌ No ASG found with Project=flylive-audio + Environment=production tags in ${{ matrix.region.aws_region }}"
            exit 1
          fi

          echo "✅ Found ASG: $ASG_NAME"
          echo "asg_name=$ASG_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for the terraform-triggered refresh (${{ matrix.region.name }})
        id: find-refresh
        # The refresh is started BY the apply (launch-template change trigger),
        # not by this workflow. Give the ASG up to 3 minutes to register it.
        #
        # Ticket 34 fix B: "no refresh appeared" is AMBIGUOUS — it is the branch
        # for a genuine no-op (fleet already on the target template) AND the
        # branch taken when the refresh should have fired and didn't (the
        # `version = "$Latest"` bug made every release land here while reporting
        # green). So this step never passes on absence alone: it verifies every
        # InService instance is on the launch template's latest version, and
        # fails the release if any is not.
        run: |
          ASG_NAME="${{ steps.asg.outputs.asg_name }}"
          for i in $(seq 1 12); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --max-records 1 \
              --query 'InstanceRefreshes[0].Status' \
              --output text 2>/dev/null || echo "None")
            if [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; then
              REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$ASG_NAME" \
                --max-records 1 \
                --query 'InstanceRefreshes[0].InstanceRefreshId' \
                --output text)
              echo "🔄 Refresh in flight: $REFRESH_ID"
              echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  ⏳ No active refresh yet (status: $STATUS) — ${i}/12"
            sleep 15
          done

          echo "ℹ️  No refresh started in this region — verifying the fleet is genuinely on the latest template version."
          ASG_JSON=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0]' --output json)

          # The ASG references its LT via .LaunchTemplate (simple path) or
          # .MixedInstancesPolicy (instance-type-fallback path) — same module,
          # two shapes (modules/autoscaling/main.tf).
          LT_ID=$(echo "$ASG_JSON" | jq -r '.LaunchTemplate.LaunchTemplateId
            // .MixedInstancesPolicy.LaunchTemplate.LaunchTemplateSpecification.LaunchTemplateId
            // empty')
          if [ -z "$LT_ID" ]; then
            echo "❌ Could not resolve the ASG's launch template id — cannot prove the fleet is current."
            exit 1
          fi

          LATEST_VERSION=$(aws ec2 describe-launch-template-versions \
            --launch-template-id "$LT_ID" --versions '$Latest' \
            --query 'LaunchTemplateVersions[0].VersionNumber' --output text)

          # An instance with no LaunchTemplate block, a different LT id, or an
          # older version counts as stale — absence of proof is failure here.
          STALE=$(echo "$ASG_JSON" | jq -r --arg lt "$LT_ID" --arg v "$LATEST_VERSION" \
            '[.Instances[] | select(.LifecycleState == "InService")
              | select((.LaunchTemplate.LaunchTemplateId // "") != $lt or (.LaunchTemplate.Version // "") != $v)
              | .InstanceId] | join(" ")')

          if [ -n "$STALE" ]; then
            echo "❌ No instance refresh started, but these InService instances are NOT on launch-template version $LATEST_VERSION: $STALE"
            echo "   The apply should have rolled the fleet and did not — this is ticket 34's failure mode. Failing the release."
            exit 1
          fi

          echo "✅ All InService instances are on launch-template version $LATEST_VERSION — genuine no-op."
          echo "refresh_id=" >> "$GITHUB_OUTPUT"

      - name: Watch Instance Refresh (${{ matrix.region.name }})
        if: ${{ steps.find-refresh.outputs.refresh_id != '' }}
        run: |
          ASG_NAME="${{ steps.asg.outputs.asg_name }}"
          REFRESH_ID="${{ steps.find-refresh.outputs.refresh_id }}"
          MAX_WAIT=2400  # 40 minutes (cross-region ECR pulls are slow)
          ELAPSED=0
          INTERVAL=30
          LAST_PROGRESS=""
          STALL_COUNT=0
          STALL_THRESHOLD=6  # 6 polls × 30s = 3 minutes of no progress change

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            PROGRESS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].PercentageComplete' \
              --output text 2>/dev/null || echo "0")

            echo "  ⏳ Status: $STATUS | Progress: ${PROGRESS}% (${ELAPSED}s elapsed)"

            case "$STATUS" in
              Successful)
                echo "✅ Instance refresh completed successfully!"
                exit 0
                ;;
              RollbackSuccessful)
                # Ticket 29 AC-3: the automated abort fired and auto_rollback
                # restored the previous launch-template version — the fleet is
                # back on the previous artifact. The release FAILED; the fleet
                # is safe.
                echo "↩️  Refresh aborted and rolled back to the previous artifact."
                exit 1
                ;;
              Failed|Cancelled|RollbackFailed)
                echo "❌ Instance refresh $STATUS"
                aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name "$ASG_NAME" \
                  --instance-refresh-ids "$REFRESH_ID" \
                  --query 'InstanceRefreshes[0].StatusReason' \
                  --output text
                exit 1
                ;;
              *)
                # Track progress stalls at ANY percentage (not just 0%)
                if [ "$PROGRESS" = "$LAST_PROGRESS" ]; then
                  STALL_COUNT=$((STALL_COUNT + 1))
                else
                  STALL_COUNT=0
                  LAST_PROGRESS="$PROGRESS"
                fi

                # If progress hasn't changed for STALL_THRESHOLD polls, investigate and rescue
                if [ $STALL_COUNT -ge $STALL_THRESHOLD ]; then
                  echo ""
                  echo "  ⚠️  Progress stuck at ${PROGRESS}% for $((STALL_COUNT * INTERVAL))s — running diagnostics..."

                  echo "  📊 Instance states:"
                  aws autoscaling describe-auto-scaling-groups \
                    --auto-scaling-group-name "$ASG_NAME" \
                    --query "AutoScalingGroups[0].Instances[].{Id:InstanceId,State:LifecycleState,Health:HealthStatus}" \
                    --output table 2>/dev/null || true

                  echo "  📊 Recent scaling activities:"
                  aws autoscaling describe-scaling-activities \
                    --auto-scaling-group-name "$ASG_NAME" \
                    --max-items 3 \
                    --query "Activities[].{Status:StatusCode,Cause:Cause}" \
                    --output table 2>/dev/null || true

                  # Rescue: Complete any stuck launch lifecycle hooks
                  PENDING=$(aws autoscaling describe-auto-scaling-groups \
                    --auto-scaling-group-name "$ASG_NAME" \
                    --query "AutoScalingGroups[0].Instances[?LifecycleState=='Pending:Wait'].InstanceId" \
                    --output text 2>/dev/null || echo "")

                  if [ -n "$PENDING" ] && [ "$PENDING" != "None" ]; then
                    LAUNCH_HOOK=$(aws autoscaling describe-lifecycle-hooks \
                      --auto-scaling-group-name "$ASG_NAME" \
                      --query "LifecycleHooks[?LifecycleTransition=='autoscaling:EC2_INSTANCE_LAUNCHING'].LifecycleHookName | [0]" \
                      --output text 2>/dev/null || echo "")

                    if [ -n "$LAUNCH_HOOK" ] && [ "$LAUNCH_HOOK" != "None" ]; then
                      for IID in $PENDING; do
                        echo "  🔧 Auto-completing launch hook for $IID"
                        aws autoscaling complete-lifecycle-action \
                          --lifecycle-action-result CONTINUE \
                          --instance-id "$IID" \
                          --auto-scaling-group-name "$ASG_NAME" \
                          --lifecycle-hook-name "$LAUNCH_HOOK" || true
                      done
                    fi
                  else
                    echo "  ℹ️  No instances in Pending:Wait — stall likely caused by health check failures"
                  fi

                  # Reset stall counter so diagnostics don't spam every poll
                  STALL_COUNT=0
                  echo ""
                fi

                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
                ;;
            esac
          done

          echo "❌ Timed out after ${MAX_WAIT}s waiting for instance refresh"
          exit 1

      - name: Health Soak — Verify stability (${{ matrix.region.name }})
        if: ${{ steps.find-refresh.outputs.refresh_id != '' }}
        # Ticket 29: this whole-region soak is the SECONDARY gate. The primary
        # canary gate runs INSIDE the refresh (CheckpointDelay + AlarmSpecification):
        # one instance soaks under real traffic and any abort alarm fails the
        # refresh automatically. This step remains as a final barrier before the
        # run goes green.
        run: |
          echo "🕐 Starting 3-minute health soak for ${{ matrix.region.name }}..."
          echo "   New instances must stay healthy for 180s."

          ASG_NAME="${{ steps.asg.outputs.asg_name }}"
          SOAK_DURATION=180
          INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $SOAK_DURATION ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            HEALTHY=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-name "$ASG_NAME" \
              --query "AutoScalingGroups[0].Instances[?HealthStatus=='Healthy'] | length(@)" \
              --output text 2>/dev/null || echo "0")

            TOTAL=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-name "$ASG_NAME" \
              --query "AutoScalingGroups[0].Instances | length(@)" \
              --output text 2>/dev/null || echo "0")

            echo "  ⏳ Health soak: ${ELAPSED}s/${SOAK_DURATION}s — ${HEALTHY}/${TOTAL} instances healthy"

            if [ "$HEALTHY" -lt 1 ]; then
              echo "❌ SOAK FAILED: Zero healthy instances at ${ELAPSED}s!"
              exit 1
            fi
          done

          echo "✅ Health soak passed — all instances stable for ${SOAK_DURATION}s"

      - name: Post Configure AWS Credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ matrix.region.aws_region }}

      - name: Rescue — un-drain any stranded InService instance (${{ matrix.region.name }})
        # Ticket 29 AC: a halted rollout must un-drain, not strand. On AWS the drain
        # script only fires in Terminating:Wait (irreversible — that instance dies
        # regardless), so a drained-but-InService instance should be impossible; this
        # step is the belt-and-braces check that makes the property observable. It
        # cancels any still-running refresh on failure, then checks/undrains each
        # InService instance via SSM Run Command: the curl runs ON the instance
        # against localhost, reading X-Internal-Key from the instance's own
        # /opt/msab/.env.secrets — the credential never crosses the network and
        # this workflow never holds it (no plaintext-HTTP transport of the key).
        # NOTE (ticket 30): cancelling a terraform-triggered refresh does NOT
        # revert the launch template — auto_rollback only acts on alarm/health
        # aborts, not manual cancels. After a cancel, roll back by dispatching
        # this workflow with the previous image_tag.
        if: failure()
        run: |
          ASG_NAME="${{ steps.asg.outputs.asg_name }}"
          [ -n "$ASG_NAME" ] || { echo "No ASG discovered — nothing to rescue"; exit 0; }

          echo "🛟 Rollout failed — cancelling any in-flight refresh and checking for stranded drains..."
          aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" 2>/dev/null \
            && echo "  🚫 Cancelled in-flight instance refresh" \
            || echo "  (no refresh in flight)"

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          # Runs on the instance as root; secrets file is 600 root-owned.
          REMOTE_SCRIPT='set -a; . /opt/msab/.env.secrets; set +a;
            STATUS=$(curl -sf -m 10 -H "X-Internal-Key: $LARAVEL_INTERNAL_KEY" http://localhost:3030/admin/status);
            DRAINING=$(echo "$STATUS" | grep -o "\"draining\":[a-z]*" | cut -d: -f2);
            if [ "$DRAINING" = "true" ]; then
              curl -sf -m 10 -X POST -H "X-Internal-Key: $LARAVEL_INTERNAL_KEY" http://localhost:3030/admin/undrain && echo UNDRAINED;
            else
              echo "draining=$DRAINING";
            fi'

          # jq builds the parameter JSON so the script's own quotes survive intact.
          SSM_PARAMS=$(jq -n --arg c "$REMOTE_SCRIPT" '{commands: [$c]}')

          for ID in $INSTANCE_IDS; do
            echo "  🔍 $ID — checking drain state via SSM Run Command..."
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$ID" \
              --document-name "AWS-RunShellScript" \
              --comment "rollout rescue: un-drain if stranded (ticket 29)" \
              --parameters "$SSM_PARAMS" \
              --query 'Command.CommandId' --output text) || { echo "  ⚠️ send-command failed for $ID"; continue; }

            for _ in $(seq 1 10); do
              sleep 3
              STATE=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
                --query 'Status' --output text 2>/dev/null || echo "Pending")
              [ "$STATE" = "Success" ] || [ "$STATE" = "Failed" ] && break
            done
            OUTPUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query 'StandardOutputContent' --output text 2>/dev/null || echo "?")
            echo "  📋 $ID: status=$STATE output: $OUTPUT"
          done

      - name: Complete job
        if: always()
        run: echo "Monitor job for ${{ matrix.region.name }} finished with status ${{ job.status }}"
